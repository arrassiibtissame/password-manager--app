<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#grad)"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59f7"/>
      <stop offset="100%" style="stop-color:#6c3ed6"/>
    </linearGradient>
  </defs>

  <!-- Lock body -->
  <rect x="28" y="48" width="44" height="34" rx="7" fill="white" opacity="0.95"/>

  <!-- Lock shackle -->
  <path d="M36 48 V36 a14 14 0 0 1 28 0 V48"
        stroke="white" stroke-width="6"
        stroke-linecap="round" fill="none"/>

  <!-- Keyhole dot -->
  <circle cx="50" cy="62" r="5" fill="#9b59f7"/>

  <!-- Keyhole line -->
  <line x1="50" y1="67" x2="50" y2="74"
        stroke="#9b59f7" stroke-width="4"
        stroke-linecap="round"/>
</svg>